# sim/roster/mvp_phi41.yaml -- the 8-agent Φ4.1 expanded MVP roster.
#
# This roster is the Φ4 -> Φ4.1 expansion that responds directly to the
# Φ4 FAIL diagnostic (`reviews/phi4_squad_v1.md`). The Φ4 squad had only
# TWO tradable strikers (Isagi + Barou), which structurally starves
# Nagi's chemical-reaction predicate: F11/F13 requires >= 2 distinct
# peers with conviction >= NAGI_V1_CONFIDENCE_FLOOR (0.70), >= 2 shared
# tags, overlapping price band, and matching direction bias.
#
# Φ4.1 adds four new v1 strikers without touching the Φ4 four. The Φ4
# `mvp_phi4.yaml` is preserved verbatim for backwards-compatible reruns.
#
# `info_tier` starts as "TBD" for every agent (including the new ones)
# until ΔInfo (F17) is measured on this run. Switching from "TBD" -> 2
# or 3 is a manifest amendment per `09-experiment-architecture.md` §6.

manifest_version: 1
manifest_label: mvp_phi41_v1
ledger:
  mode: full
allocator: tqs_hrp_v1   # placeholder; actual HRP lives in sim/allocator/* (Φ5+)
seed: 42

agents:
