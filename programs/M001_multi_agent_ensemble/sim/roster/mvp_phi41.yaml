      Predicate-starvation FALSIFIER. Never trades. Mirrors the
      highest-conviction peer on the same symbol per tick. +0.10 lift
      closes the production-cell-to-Nagi-floor gap deterministically.
      If even ONE peer fires at conviction >= 0.60, Reo provides a
      second Nagi-qualifying peer with shared tags + matching dir.
      Tier-2 by design (his weapon IS reading the ledger).
