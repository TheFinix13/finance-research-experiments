    module: programs.M001_multi_agent_ensemble.sim.agents.a01_isagi
    class: A1IsagiV1
    canon_role:
      canon_player: "Yoichi Isagi"
      weapon: "metavision"
      ego: 0.60
      target_hold_hours: 24.0
      narrative_voice: "metavision read of the field's future state"
    home_tf: H4
    symbols: ["EURUSD", "GBPUSD", "USDCAD"]
    info_tier: TBD
    role_in_phi41: "carryover -- baseline striker (production zone_d1_against)"

  - agent_id: nagi_seishiro
